[project]
name = "amadeus-pc-bridge"
version = "0.1.0"
description = "PC-side conversation, TTS, and serial bridge for Amadeus"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pycaw==20251023; sys_platform == 'win32'",
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.16,<0.17",
]

[project.scripts]
amadeus-bridge = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
